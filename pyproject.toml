[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pandoc-mcp"
version = "0.1.0"
description = "MCP server for document conversion with Pandoc."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mcp-service-kit @ git+https://github.com/geosp/mcp-service-kit@v0.1.0",
    "python-multipart>=0.0.20",
]

[project.scripts]
pandoc-mcp = "pandoc_mcp.server:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pandoc_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
